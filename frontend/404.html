<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kedai Kopi — Order</title>
    <script>
      // GitHub Pages SPA redirect: maps /coffee-trial/staff to the app,
      // preserving the path in the query string.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
